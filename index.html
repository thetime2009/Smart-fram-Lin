<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-on { color: #28a745; font-weight: bold; }
        .status-off { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container py-4">
    <header class="text-center mb-4">
        <h2 class="fw-bold text-success"><i class="bi bi-leaf"></i> Smart Farm Control</h2>
        <p class="text-muted">ควบคุมระบบรดน้ำผ่าน GitHub Pages</p>
    </header>

    <!-- Monitoring Section -->
    <div class="row g-3 mb-4 text-center">
        <div class="col-6 col-md-3">
            <div class="card p-3">
                <i class="bi bi-thermometer-half text-danger fs-1"></i>
                <div class="text-muted small">อุณหภูมิ</div>
                <h3 id="temp">--</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card p-3">
                <i class="bi bi-droplets text-primary fs-1"></i>
                <div class="text-muted small">ความชื้นดิน</div>
                <h3 id="soil">--</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card p-3">
                <i class="bi bi-cloud-rain text-info fs-1"></i>
                <div class="text-muted small">ปริมาณฝน</div>
                <h3 id="rain">--</h3>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card p-3">
                <i class="bi bi-water text-warning fs-1"></i>
                <div class="text-muted small">น้ำที่ใช้ (ลิตร)</div>
                <h3 id="water_used">--</h3>
            </div>
        </div>
    </div>

    <!-- Control Section -->
    <div class="row g-3">
        <!-- Main Mode Switch -->
        <div class="col-md-6">
            <div class="card p-4">
                <h5 class="mb-3">โหมดการทำงาน</h5>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span>ระบบอัตโนมัติ (V10)</span>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="v10_switch" onchange="toggleBlynk('V10', this.checked)">
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span>เลือกโหมด (1:เวลา / 2:ความชื้น)</span>
                    <select class="form-select w-50" id="menu_select" onchange="updateBlynk('V27', this.value)">
                        <option value="1">ตั้งเวลา</option>
                        <option value="2">ความชื้น</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Relay Control -->
        <div class="col-md-6">
            <div class="card p-4 h-100">
                <h5 class="mb-3">ควบคุมวาล์วแยกโซน</h5>
                <div class="row text-center">
                    <div class="col-3">
                        <button class="btn btn-outline-success w-100" onclick="updateBlynk('V1', 1)">Z1</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-outline-success w-100" onclick="updateBlynk('V2', 1)">Z2</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-outline-success w-100" onclick="updateBlynk('V3', 1)">Z3</button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-outline-success w-100" onclick="updateBlynk('V4', 1)">Z4</button>
                    </div>
                </div>
                <button class="btn btn-danger mt-3 w-100" onclick="stopAllRelays()">ปิดวาล์วทั้งหมด</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
