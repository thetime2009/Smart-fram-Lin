<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm Control</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f5f7fa; }
.card { border-radius:15px; }
.timer-table td { padding:5px 10px; }
</style>
</head>

<body class="p-3">

<div class="container">

<h3 class="mb-3">🌱 Smart Farm Dashboard</h3>

<!-- SENSOR -->
<div class="card p-3 mb-3">
<h5>📊 Sensor</h5>
<div>🌡 Temp: <span id="temp">--</span></div>
<div>💧 Soil: <span id="soil">--</span></div>
<div>🌧 Rain: <span id="rain">--</span></div>
<div>🚿 Water Used: <span id="water_used">--</span></div>
<div>🌿 VPD: <span id="vpd_val">--</span></div>
<div>📌 Status: <span id="status_val">--</span></div>
</div>

<!-- CONTROL -->
<div class="card p-3 mb-3">
<h5>🎛 Control</h5>

<div class="form-check form-switch">
<input class="form-check-input" type="checkbox" id="v10_switch" onchange="toggleBlynk('V10', this.checked)">
<label class="form-check-label">Auto Mode</label>
</div>

<div class="mt-2">
<button id="btn-z1" class="btn btn-outline-success" onclick="updateBlynk('V11',1)">Zone 1</button>
<button id="btn-z2" class="btn btn-outline-success" onclick="updateBlynk('V12',1)">Zone 2</button>
<button id="btn-z3" class="btn btn-outline-success" onclick="updateBlynk('V13',1)">Zone 3</button>
<button id="btn-z4" class="btn btn-outline-success" onclick="updateBlynk('V14',1)">Zone 4</button>
</div>

</div>

<!-- TIMER -->
<div class="card p-3 mb-3">
<h5>⏱ Timer</h5>

<table class="table timer-table">
<tr><th>Zone</th><th>Start</th><th>Stop</th></tr>
<tr><td>Z1</td><td id="v40_start">--</td><td id="v40_stop">--</td></tr>
<tr><td>Z2</td><td id="v41_start">--</td><td id="v41_stop">--</td></tr>
<tr><td>Z3</td><td id="v42_start">--</td><td id="v42_stop">--</td></tr>
<tr><td>Z4</td><td id="v43_start">--</td><td id="v43_stop">--</td></tr>
</table>

<hr>

<div>
<label><input type="radio" name="timer_zone" value="V40"> Z1</label>
<label><input type="radio" name="timer_zone" value="V41"> Z2</label>
<label><input type="radio" name="timer_zone" value="V42"> Z3</label>
<label><input type="radio" name="timer_zone" value="V43"> Z4</label>
</div>

<div class="mt-2">
Start: <input type="time" id="start_t">
Stop: <input type="time" id="stop_t">
</div>

<button class="btn btn-primary mt-2" onclick="saveTimer()">💾 Save Timer</button>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
